# Cấu hình mypy cho `mypy app/` (chạy với cwd = backend/).
# jose, passlib, boto3 không kèm stub/py.typed; dự án không thêm gói types-*,
# nên chỉ bỏ qua import của đúng các module này (không bỏ qua toàn cục).

[mypy]

[mypy-jose.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True
