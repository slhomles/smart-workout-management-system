name: CI AI Services

on:
  push:
    branches: [main, develop]
    paths:
      - "ai-services/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "ai-services/**"

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-services/requirements.txt
      
      - name: Install dependencies
        run: |
          cd ai-services
          pip install -r requirements.txt
      
      - name: Lint with Ruff
        run: |
          cd ai-services
          ruff check .
      
      - name: Run tests
        run: |
          cd ai-services
          pytest tests/
